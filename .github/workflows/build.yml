name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Find APK
        run: |
          mkdir -p artifact
          APK=$(find . -type f -iname "*.apk" | head -n 1)
          echo "APK encontrado: $APK"
          cp "$APK" artifact/Flamingo-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flamingo-debug
          path: artifact/Flamingo-debug.apk
